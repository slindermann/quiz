<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Quiz - Register</title>
  <link rel="icon" id="favicon" href="/api/favicon">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <img id="regLogo" class="logo-img hidden" alt="Logo" style="margin:0 auto 8px">
    <h1>Z-Quiz</h1>
    <div class="subtitle" data-i18n="registerTitle">Admin Registration</div>
  </div>

  <div class="container">
    <!-- Step 1: Email -->
    <div class="card slide-in" id="stepEmail" style="margin-top:24px;max-width:420px;margin-left:auto;margin-right:auto">
      <h2 class="text-center mb-2" data-i18n="registerTitle">Admin Registration</h2>
      <p class="text-muted text-sm text-center mb-2" data-i18n="registerHint">Register with your corporate email address.</p>
      <div class="form-group">
        <label data-i18n="email">E-Mail</label>
        <input type="email" id="regEmail" class="form-control" placeholder="name@zscaler.com" autocomplete="email">
      </div>
      <button class="btn btn-primary btn-block" id="btnRequestCode" data-i18n="sendCode">Send Verification Code</button>
      <p id="emailError" class="text-center text-sm mt-1" style="color:var(--zs-red)"></p>
      <div class="text-center mt-2">
        <a href="/admin.html" class="text-sm" style="color:var(--zs-blue)" data-i18n="backToLogin">Back to Login</a>
      </div>
    </div>

    <!-- Step 2: Verification Code -->
    <div class="card slide-in hidden" id="stepCode" style="margin-top:24px;max-width:420px;margin-left:auto;margin-right:auto">
      <h2 class="text-center mb-2" data-i18n="enterCode">Enter Verification Code</h2>
      <p class="text-muted text-sm text-center mb-2" id="codeSentMsg"></p>
      <div class="form-group">
        <label data-i18n="verificationCode">Verification Code</label>
        <input type="text" id="regCode" class="form-control" placeholder="123456" maxlength="6"
               autocomplete="one-time-code" style="text-align:center;font-size:1.5rem;letter-spacing:8px">
      </div>
      <button class="btn btn-primary btn-block" id="btnVerifyCode" data-i18n="verify">Verify</button>
      <p id="codeError" class="text-center text-sm mt-1" style="color:var(--zs-red)"></p>
    </div>

    <!-- Step 3: Success -->
    <div class="card slide-in hidden" id="stepSuccess" style="margin-top:24px;max-width:420px;margin-left:auto;margin-right:auto">
      <div class="text-center">
        <div style="font-size:3rem;margin-bottom:12px">&#10003;</div>
        <h2 class="mb-2" data-i18n="registrationComplete">Registration Complete</h2>
        <p class="text-muted mb-2" data-i18n="checkEmailForPassword">Check your email for your temporary password.</p>
        <a href="/admin.html" class="btn btn-primary" data-i18n="goToLogin">Go to Login</a>
      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:24px 16px 16px;font-size:0.8rem;color:var(--zs-gray)">
    <a href="/impressum.html" style="color:var(--zs-gray)">Impressum</a> &middot;
    <a href="/datenschutz.html" style="color:var(--zs-gray)">Datenschutz</a>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
